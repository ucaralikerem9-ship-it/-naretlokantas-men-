<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#081008"><title>Çınar Et Lokantası</title>
<style>
:root{--bg:#070d08;--panel:#10190e;--panel2:#182216;--gold:#d9ad50;--cream:#eee4cf;--line:#51452b;--muted:#c0b8a5}
*{box-sizing:border-box}body{margin:0;background:#070d08;color:var(--cream);font-family:Georgia,"Times New Roman",serif}
button,input{font:inherit}button{cursor:pointer;color:inherit}
#intro{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(0deg,#030703dc,#0307033b),url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1400&q=90") center/cover;animation:exit .7s ease 4.3s forwards}
.introinner{animation:fadein 1s both}.tree{font-size:66px;color:#e0b452;text-shadow:0 0 22px #d49b32}.introbrand{font-size:clamp(42px,10vw,70px);line-height:.88;color:#efc761;text-shadow:0 2px 14px #000;margin:12px}.introbrand small{display:block;font-size:.36em;letter-spacing:5px;color:#f3e8d4;margin-top:12px}.motto{font-style:italic;font-size:18px;margin:30px 0}.progress{height:4px;width:205px;background:#544522;margin:22px auto;overflow:hidden}.progress:after{content:"";display:block;height:100%;background:#e6b746;width:0;animation:fill 4s linear forwards}.progresslabel{font:11px system-ui;color:#e3cf9e}@keyframes fill{to{width:100%}}@keyframes exit{to{opacity:0;visibility:hidden;pointer-events:none}}@keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.shell{max-width:470px;margin:auto;min-height:100vh;padding:0 10px 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 12px}.brand{display:flex;align-items:center;gap:8px;color:#e7ba58}.brandmark{font-size:33px}.brandname{font-size:26px;line-height:1}.brandname small{display:block;font-size:10px;letter-spacing:3px;color:#e7ddc6;margin-top:4px}.hamb{background:transparent;border:0;color:#e9bc55;font-size:29px;line-height:1}
.search{display:flex;align-items:center;gap:9px;border:1px solid #65552e;border-radius:24px;background:#182117;padding:10px 14px;margin:3px 8px 16px;color:#cdb47a}.search input{border:0;background:transparent;outline:0;width:100%;color:#f3ead6;font-size:14px}
.page{display:none}.page.active{display:block}.homebrand{text-align:center;margin:9px 0 18px}.homebrand h1{font-size:25px;color:#e4b654;margin:0}.homebrand p{margin:4px;color:#bdb59f;font-style:italic;font-size:13px}
.homecats{display:grid;gap:14px}.cat{height:200px;border-radius:18px;border:1px solid #76602e;overflow:hidden;position:relative;background:#10190e;padding:0;width:100%}.cat img{width:100%;height:100%;object-fit:cover}.cat:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#060b06e8,transparent 68%)}.catcaption{position:absolute;z-index:2;bottom:13px;left:16px;right:14px;display:flex;justify-content:space-between;align-items:center;font-size:24px;color:#e8bf5c}.catcaption span{border:1px solid #d6aa49;border-radius:50%;width:34px;height:34px;display:grid;place-items:center}
.pagehead{display:flex;align-items:center;gap:12px;margin:12px 4px 14px}.back{border:0;background:transparent;color:#e9bb53;font-size:27px;padding:0 4px}.pagehead h2{font-size:24px;margin:0;color:#f1e5d0}
.list{display:grid;gap:8px}.rowitem{height:72px;border:1px solid #4e442a;background:linear-gradient(90deg,#111a0f,#151f13);border-radius:14px;display:flex;align-items:center;gap:12px;padding:6px 10px;width:100%;text-align:left}.rowitem img{height:57px;width:90px;border-radius:9px;object-fit:cover}.rowname{flex:1;font-size:16px}.rowprice{color:#f0c45e;font-weight:bold;font-size:14px;white-space:nowrap}.arrow{color:#d9ae4d;font-size:24px}
.detailimg{width:100%;height:260px;object-fit:cover;border-radius:17px;border:1px solid #69552d}.detailtitle{text-align:center;font-size:27px;margin:13px 0 6px;color:#f2e6d2}.detaildesc{text-align:center;font-size:14px;color:#c4bca9;line-height:1.55;margin:0 12px 14px}.ornament{text-align:center;color:#d6ac4b;font-size:20px;margin:12px 0}.favorite{width:100%;border:1px solid #75602e;border-radius:22px;background:#162116;padding:12px;color:#e4bb5a;font-size:15px}.pricebox{margin-top:12px;text-align:center;border:1px solid #d9ad50;border-radius:16px;background:#201c10;padding:15px;color:#f0c45e;font-size:25px;font-weight:bold}.pricebox.unavailable{font-size:16px;color:#c0b8a5}
.drinkrow img{width:60px;object-fit:contain;background:#10170f}
.results{display:grid;gap:10px}.resultcard{border:1px solid #66512d;border-radius:15px;overflow:hidden;background:#121a10}.resultcard img{height:160px;width:100%;object-fit:cover}.resultlabel{padding:10px;display:flex;align-items:center;justify-content:space-between;font-size:17px}
.noresults{text-align:center;padding:25px;color:#bcb49f;font-size:13px}
footer{text-align:center;color:#d4b25d;font-style:italic;padding:23px 0 10px;font-size:20px}
</style></head><body>
<div id="intro"><div class="introinner"><div class="tree">♣</div><div class="introbrand">Çınar<small>ET LOKANTASI</small></div><div class="motto">“Geleneksel Lezzet<br>Modern Sunum”</div><div class="progress"></div><div class="progresslabel">Menü Yükleniyor…</div></div></div>
<div class="shell">
<header><div class="brand"><div class="brandmark">♣</div><div class="brandname">Çınar<small>ET LOKANTASI</small></div></div><button class="hamb" aria-label="Ana menü" onclick="go('home')">☰</button></header>
<div class="search"><span>⌕</span><input id="search" placeholder="Ürün ara…"></div>
<section class="page active" id="home"><div class="homebrand"><h1>Çınar Et Lokantası</h1><p>Geleneksel lezzetler</p></div><div class="homecats">
<button class="cat" onclick="go('pides')"><img src="https://images.unsplash.com/photo-1604382355076-af4b0eb60143?auto=format&fit=crop&w=1000&q=85" alt="Pideler"><div class="catcaption">Pideler <span>›</span></div></button>
<button class="cat" onclick="go('drinks')"><img src="https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=1000&q=85" alt="İçecekler"><div class="catcaption">İçecekler <span>›</span></div></button>
</div><footer>— ♣ —<br>Afiyet Olsun</footer></section>
<section class="page" id="pides"><div class="pagehead"><button class="back" onclick="go('home')">‹</button><h2>Pideler</h2></div><div class="list" id="pideList"></div></section>
<section class="page" id="drinks"><div class="pagehead"><button class="back" onclick="go('home')">‹</button><h2>İçecekler</h2></div><div class="list" id="drinkList"></div></section>
<section class="page" id="detail"><div class="pagehead"><button class="back" onclick="go(currentCategory)">‹</button><h2 id="detailHeader"></h2></div><div id="detailbody"></div></section>
<section class="page" id="searchpage"><div class="pagehead"><button class="back" onclick="go('home')">‹</button><h2>Arama</h2></div><div class="results" id="results"></div></section>
</div>
<script>
const pidImages=[
"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1604382355076-af4b0eb60143?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1604382355076-af4b0eb60143?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1604382355076-af4b0eb60143?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1604382355076-af4b0eb60143?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1604382355076-af4b0eb60143?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1604382355076-af4b0eb60143?auto=format&fit=crop&w=900&q=85"];
const pides=["Lahmacun","Acılı Lahmacun","Kıymalı Pide","Acılı Kıymalı Pide","Kıymalı Üstü Kaşarlı","Kaşarlı","Kuşbaşılı","Karışık","Kuşbaşı Kaşarlı"];
const drinkNames=["Ayran","Büyük Ayran","Litrelik Ayran","Litrelik Kola","Litrelik Fanta","Kutu Kola","Kutu Fanta","Su"];
const prices={"Lahmacun":150,"Acılı Lahmacun":150,"Kıymalı Pide":250,"Acılı Kıymalı Pide":250,"Kaşarlı":250,"Kuşbaşılı":380,"Karışık":400,"Kıymalı Üstü Kaşarlı":300,"Kuşbaşı Kaşarlı":400,"Ayran":20,"Büyük Ayran":50,"Litrelik Ayran":100,"Litrelik Kola":100,"Litrelik Fanta":100,"Kutu Kola":70,"Kutu Fanta":70,"Su":20};
const drinkPics=[
"https://images.unsplash.com/photo-1550583724-b2692b85b150?auto=format&fit=crop&w=500&q=80",
"https://images.unsplash.com/photo-1550583724-b2692b85b150?auto=format&fit=crop&w=500&q=80",
"https://images.unsplash.com/photo-1550583724-b2692b85b150?auto=format&fit=crop&w=500&q=80",
"https://images.unsplash.com/photo-1629203851122-3726a3d58b09?auto=format&fit=crop&w=500&q=80",
"https://images.unsplash.com/photo-1624517452488-048692d1c6a9?auto=format&fit=crop&w=500&q=80",
"https://images.unsplash.com/photo-1554866585-cd94860890b7?auto=format&fit=crop&w=500&q=80",
"https://images.unsplash.com/photo-1624517452488-048692d1c6a9?auto=format&fit=crop&w=500&q=80",
"https://images.unsplash.com/photo-1564419320461-6870880221ad?auto=format&fit=crop&w=500&q=80"];
let currentCategory="pides";
function go(id){document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===id));document.getElementById("search").value="";if(id!=="searchpage")document.getElementById("search").blur();window.scrollTo({top:0,behavior:"smooth"})}
function openDetail(name,kind,index){currentCategory=kind;document.getElementById("detailHeader").textContent=name;let img=kind==="pides"?pidImages[index]:drinkPics[index];let desc=kind==="pides"?"Geleneksel usulde hazırlanan Çınar Et Lokantası lezzeti.":"Çınar Et Lokantası içecek menüsünden.";let price=prices[name];let priceHtml=price!==undefined?`<div class="pricebox">${price} TL</div>`:`<div class="pricebox unavailable">Fiyat bilgisi yok</div>`;document.getElementById("detailbody").innerHTML=`<img class="detailimg" src="${img}" alt="${name}"><h2 class="detailtitle">${name}</h2><p class="detaildesc">${desc}</p><div class="ornament">— ❧ —</div><button class="favorite" onclick="toggleFav(this,'${name.replace(/'/g,"\'")}')">♡ Favorilere Ekle</button>${priceHtml}`;go("detail")}
function toggleFav(btn,name){let isOn=btn.dataset.on==="1";btn.dataset.on=isOn?"0":"1";btn.classList.toggle("faved",!isOn);btn.innerHTML=isOn?"♡ Favorilere Ekle":"♥ Favorilere Eklendi"}
function renderLists(){document.getElementById("pideList").innerHTML=pides.map((name,i)=>`<button class="rowitem" onclick="openDetail('${name.replace(/'/g,"\\'")}','pides',${i})"><img src="${pidImages[i]}" alt="${name}"><span class="rowname">${name}</span>${prices[name]!==undefined?`<span class="rowprice">${prices[name]} TL</span>`:""}<span class="arrow">›</span></button>`).join("");document.getElementById("drinkList").innerHTML=drinkNames.map((name,i)=>`<button class="rowitem drinkrow" onclick="openDetail('${name}','drinks',${i})"><img src="${drinkPics[i]}" alt="${name}"><span class="rowname">${name}</span><span class="rowprice">${prices[name]} TL</span><span class="arrow">›</span></button>`).join("")}
function searchAll(q){let normalized=q.toLocaleLowerCase("tr").trim();let matchingFoods=pides.map((n,i)=>({n,i,kind:"pides",img:pidImages[i]})).filter(x=>x.n.toLocaleLowerCase("tr").includes(normalized));let matchingDrinks=drinkNames.map((n,i)=>({n,i,kind:"drinks",img:drinkPics[i]})).filter(x=>x.n.toLocaleLowerCase("tr").includes(normalized));let matches=[...matchingFoods,...matchingDrinks];document.getElementById("results").innerHTML=matches.length?matches.map(x=>`<button class="resultcard" onclick="openDetail('${x.n.replace(/'/g,"\\'")}','${x.kind}',${x.i})"><img src="${x.img}" alt="${x.n}"><div class="resultlabel">${x.n}<span class="arrow">›</span></div></button>`).join(""):'<div class="noresults">Aradığınız ürünü bulamadınız mı?<br>Lütfen farklı bir anahtar kelime deneyin.</div>';go("searchpage")}
document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.value.trim())searchAll(e.target.value)});
renderLists();
</script></body></html>
