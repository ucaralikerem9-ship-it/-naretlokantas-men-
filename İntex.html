<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Çınar Et Lokantası</title>
<style>
:root{--gold:#d7ad52;--gold2:#f0d27c;--ink:#071109;--card:#101b0e;--edge:#796432;--cream:#eee4c8}*{box-sizing:border-box}body{margin:0;background:#050805;color:var(--cream);font-family:Georgia,'Times New Roman',serif;display:flex;justify-content:center;min-height:100vh}.phone{position:relative;width:min(100vw,440px);min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#1d2a14 0,#080d07 45%,#020502 100%);overflow:hidden;box-shadow:0 0 36px #000}.screen{display:none;min-height:100dvh;padding:20px 16px 28px}.screen.active{display:flex;flex-direction:column}.toprow{height:40px;display:flex;align-items:center;justify-content:space-between}.iconbtn{border:0;background:transparent;color:var(--gold2);font-size:28px;cursor:pointer;width:44px}.leaf{font-size:26px;color:var(--gold);text-shadow:0 0 10px #ad8729}.title{color:var(--gold2);font-size:25px;text-align:center;text-shadow:0 2px 8px #000;margin:4px 0 12px}.panel{border:1px solid #77602c;background:linear-gradient(120deg,#0b1409,#101a0e);border-radius:18px;box-shadow:inset 0 0 12px #0008,0 3px 10px #0005}.splash{padding:0!important;justify-content:center;align-items:center;text-align:center;background:linear-gradient(#07100799,#04060499),url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1000&q=85') center/cover}.splash-logo{font-size:48px;color:#edcf78;line-height:.94;text-shadow:0 3px 7px #000}.splash-logo small{display:block;font-size:25px;margin-top:5px}.splash-tree{font-size:64px;color:#d4a740;text-shadow:0 0 18px #b98927}.tagline{font-style:italic;font-size:22px;margin-top:45px;line-height:1.4}.loader{width:78%;height:8px;border:1px solid #c49a44;border-radius:10px;margin:24px auto 8px;overflow:hidden}.loader span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#8a5e15,#f6d778);animation:shine 1.2s linear}@keyframes shine{0%{width:10%}100%{width:100%}}.loadcaption{font-size:12px;color:#dfc777}
.home-logo{text-align:center;padding:7px 0 15px}.tree{font-size:55px;color:var(--gold);text-shadow:0 0 14px #bb8d27}.brand{font-size:39px;color:#e7c56e;line-height:1}.brand small{display:block;font-size:17px;letter-spacing:3px;margin-top:5px}.searchbar{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:30px;margin-bottom:18px;background:#151f11;border:1px solid #69592d;color:#d9bf76}.searchbar input{flex:1;background:transparent;border:0;outline:none;color:#f4e5bd;font:16px Arial}.category{position:relative;height:222px;border-radius:20px;overflow:hidden;margin:0 0 15px;border:1px solid #765f30;display:block;text-align:left;background:#080d07;color:white;cursor:pointer;padding:0}.category img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.84)}.catname{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#050805e8);padding:17px 15px 13px;font-size:23px;color:#fff}.circle{position:absolute;right:14px;bottom:14px;width:38px;height:38px;border-radius:50%;border:1px solid #d0ab5b;color:#f0d27c;display:grid;place-items:center;font-size:24px;background:#080b07a8}.homefooter{text-align:center;color:#d7b864;font-style:italic;font-size:23px;padding:10px 0 0}
.listarea{display:flex;flex-direction:column;gap:8px;overflow:auto;padding-bottom:10px}.itemrow{display:flex;align-items:center;gap:13px;height:66px;padding:6px 11px;border:1px solid #635326;background:linear-gradient(110deg,#0a1008,#17200f);border-radius:14px;color:var(--cream);font-size:18px;text-align:left;cursor:pointer}.itemrow img{width:70px;height:51px;object-fit:cover;border-radius:9px}.itemrow .name{flex:1}.arrow{font-size:26px;color:var(--gold2)}.detailphoto{height:340px;border-radius:18px;overflow:hidden;margin:4px 0 15px;border:1px solid #745f2e}.detailphoto img{width:100%;height:100%;object-fit:cover}.detailname{text-align:center;font-size:28px;color:var(--gold2);margin:4px 0 10px}.desc{text-align:center;font-family:Arial,sans-serif;line-height:1.45;color:#d9d4c5;margin:0 10px 20px}.ornament{display:flex;align-items:center;gap:14px;color:var(--gold);justify-content:center;margin:7px 0 20px}.ornament:before,.ornament:after{content:'';height:1px;width:38%;background:linear-gradient(90deg,transparent,#b88b36)}.favorite{border:1px solid #8b743b;border-radius:25px;background:linear-gradient(#172310,#0a1108);color:#e8cf83;padding:14px;font:17px Georgia;width:100%;cursor:pointer}.favorite.on{background:#382a12;color:#ffe3a0}.searchscreen .searchbar{margin-top:0}.resultcard{position:relative;height:175px;border:1px solid #6e592c;border-radius:17px;overflow:hidden;padding:0;margin-bottom:13px;background:#081007;cursor:pointer;color:white}.resultcard img{width:100%;height:100%;object-fit:cover;filter:brightness(.78)}.resultname{position:absolute;left:0;right:0;bottom:0;padding:15px;background:linear-gradient(transparent,#050805ee);text-align:left;font-size:20px}.noresults{text-align:center;color:#c8b88c;padding:22px 12px;font:15px Arial}.smallsearch{display:none}.modal{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:25px}.modal.show{display:flex}.modalbox{width:100%;border:1px solid var(--gold);border-radius:16px;background:#111a0e;padding:20px;text-align:center}.modalbox p{font:16px Arial;color:#e8d9b0}.modalbox button{border:1px solid #9c7c3a;background:#18220f;color:#e8ca75;padding:10px 25px;border-radius:22px;margin-top:8px}
@media(min-width:500px){body{padding:12px}.phone{border-radius:25px;min-height:calc(100dvh - 24px)}.screen{min-height:calc(100dvh - 24px)}}
</style></head><body><main class="phone">
<section id="splash" class="screen splash active"><div><div class="splash-tree">✦♣✦</div><div class="splash-logo">Çınar<small>Lokantası</small></div><div class="tagline">“Geleneksel Lezzet,<br>Modern Sunum”</div><div class="loader"><span></span></div><div class="loadcaption">Menü Yükleniyor...<br>%100</div></div></section>
<section id="home" class="screen"><div class="toprow"><span></span><button class="iconbtn" onclick="show('home')" aria-label="Ana sayfa">☰</button></div><div class="home-logo"><div class="tree">♣</div><div class="brand">Çınar<small>Lokantası</small></div></div><div class="searchbar" role="button" onclick="openSearch()"><span>⌕</span><span style="opacity:.85">Ürün ara...</span></div><button class="category" onclick="show('pides')"><img alt="Pideler" src="https://images.unsplash.com/photo-1604382355076-af4b0eb60143?auto=format&fit=crop&w=950&q=85"><div class="catname">Pideler<span class="circle">›</span></div></button><button class="category" onclick="show('drinks')"><img alt="İçecekler" src="https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=950&q=85"><div class="catname">İçecekler<span class="circle">›</span></div></button><div class="homefooter">— ❧ —<br>Afiyet olsun</div></section>
<section id="pides" class="screen"><div class="toprow"><button class="iconbtn" onclick="show('home')">‹</button><div class="title">Pideler</div><span class="leaf">♣</span></div><div class="listarea" id="pideRows"></div></section>
<section id="detail" class="screen"><div class="toprow"><button class="iconbtn" onclick="backToList()">‹</button><div class="title" id="detailTitle">Lahmacun</div><button class="iconbtn" id="heartTop" onclick="toggleFavorite()">♡</button></div><div class="detailphoto"><img id="detailImg" src="" alt="Seçilen ürün"></div><div class="detailname" id="detailName"></div><p class="desc" id="detailDesc"></p><div class="ornament">♣</div><button class="favorite" id="favoriteButton" onclick="toggleFavorite()">♡ Favorilere Ekle</button></section>
<section id="drinks" class="screen"><div class="toprow"><button class="iconbtn" onclick="show('home')">‹</button><div class="title">İçecekler</div><span class="leaf">♣</span></div><div class="listarea" id="drinkRows"></div></section>
<section id="search" class="screen searchscreen"><div class="toprow"><button class="iconbtn" onclick="show('home')">‹</button><div class="title">Arama</div><span></span></div><div class="searchbar"><span>⌕</span><input id="searchInput" placeholder="Ürün ara..." autocomplete="off"><button class="iconbtn" style="font-size:20px;width:28px" onclick="clearSearch()">×</button></div><div id="searchResults" class="listarea"></div><div id="emptySearch" class="noresults">⌕<br><br>Aradığınız ürünü bulamadınız mı?<br>Lütfen farklı bir anahtar kelime deneyin.</div></section>
<div class="modal" id="toast"><div class="modalbox"><p id="toastText">Favorilere eklendi.</p><button onclick="hideToast()">Tamam</button></div></div>
</main><script>
const pideItems=[
{name:'Lahmacun',img:'https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=900&q=85',desc:'Özel baharatlarla hazırlanmış geleneksel lezzet.'},
{name:'Kıymalı',img:'https://images.unsplash.com/photo-1604382355076-af4b0eb60143?auto=format&fit=crop&w=900&q=85',desc:'Geleneksel kıymalı pide.'},
{name:'Kaşarlı',img:'https://images.unsplash.com/photo-1571407970349-bc81e7e96d47?auto=format&fit=crop&w=900&q=85',desc:'Bol kaşarlı pide.'},
{name:'Kuşbaşılı',img:'https://images.unsplash.com/photo-1604382355076-af4b0eb60143?auto=format&fit=crop&w=900&q=85',desc:'Kuşbaşı et ile hazırlanır.'},
{name:'Karışık',img:'https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=900&q=85',desc:'Çınar’ın karışık pide lezzeti.'},
{name:'Kıymalı Üstü Kaşarlı',img:'https://images.unsplash.com/photo-1571407970349-bc81e7e96d47?auto=format&fit=crop&w=900&q=85',desc:'Kıymalı pide üzerine eritilmiş kaşar.'},
{name:'Kıymalı Yumurtalı',img:'https://images.unsplash.com/photo-1604382355076-af4b0eb60143?auto=format&fit=crop&w=900&q=85',desc:'Kıymalı ve yumurtalı pide.'},
{name:'Acılı Lahmacun',img:'https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=900&q=85',desc:'Acı sevenler için baharatlı lahmacun.'},
{name:'Acılı Kıymalı',img:'https://images.unsplash.com/photo-1604382355076-af4b0eb60143?auto=format&fit=crop&w=900&q=85',desc:'Acı baharatlarla kıymalı pide.'},
{name:'Kuşbaşı Kaşarlı',img:'https://images.unsplash.com/photo-1571407970349-bc81e7e96d47?auto=format&fit=crop&w=900&q=85',desc:'Kuşbaşı et ve kaşar.'},
{name:'Kıymalı Kaşarlı',img:'https://images.unsplash.com/photo-1604382355076-af4b0eb60143?auto=format&fit=crop&w=900&q=85',desc:'Kıymalı, kaşarlı pide.'}];
const drinks=[
{name:'Büyük Ayran',img:'https://images.unsplash.com/photo-1553639118-8f4b2c1a7b8b?auto=format&fit=crop&w=400&q=80',desc:'Serin ayran.'},
{name:'Küçük Ayran',img:'https://images.unsplash.com/photo-1553639118-8f4b2c1a7b8b?auto=format&fit=crop&w=400&q=80',desc:'Ayran.'},
{name:'1 Litre Ayran',img:'https://images.unsplash.com/photo-1553639118-8f4b2c1a7b8b?auto=format&fit=crop&w=400&q=80',desc:'Litrelik ayran.'},
{name:'1 Litre Kola',img:'https://images.unsplash.com/photo-1629203851122-3726ecdf080e?auto=format&fit=crop&w=400&q=80',desc:'Litrelik kola.'},
{name:'1 Litre Fanta',img:'https://images.unsplash.com/photo-1624517452488-04869289c4ca?auto=format&fit=crop&w=400&q=80',desc:'Litrelik portakallı gazlı içecek.'},
{name:'Kutu Kola',img:'https://images.unsplash.com/photo-1629203851122-3726ecdf080e?auto=format&fit=crop&w=400&q=80',desc:'Soğuk kutu kola.'},
{name:'Kutu Fanta',img:'https://images.unsplash.com/photo-1624517452488-04869289c4ca?auto=format&fit=crop&w=400&q=80',desc:'Soğuk kutu Fanta.'},
{name:'Su',img:'https://images.unsplash.com/photo-1564419320461-6870880221ad?auto=format&fit=crop&w=400&q=80',desc:'Şişe su.'}];
let activeList='pides',selected=null;let favorites=JSON.parse(localStorage.getItem('cinarFavorites')||'[]');
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='pides'||id==='drinks')activeList=id;}
function rowHtml(item,kind,index){return `<button class="itemrow" onclick="openDetail('${kind}',${index})"><img loading="lazy" src="${item.img}" alt="${item.name}"><span class="name">${item.name}</span><span class="arrow">›</span></button>`}
function render(){document.getElementById('pideRows').innerHTML=pideItems.map((x,i)=>rowHtml(x,'pides',i)).join('');document.getElementById('drinkRows').innerHTML=drinks.map((x,i)=>rowHtml(x,'drinks',i)).join('')}
function openDetail(kind,i){selected={kind,index:i};let item=(kind==='pides'?pideItems:drinks)[i];document.getElementById('detailTitle').textContent=item.name;document.getElementById('detailName').textContent=item.name;document.getElementById('detailImg').src=item.img;document.getElementById('detailDesc').textContent=item.desc;syncFavorite();show('detail')}
function backToList(){show(activeList)}
function syncFavorite(){if(!selected)return;let key=selected.kind+':'+selected.index,has=favorites.includes(key);let btn=document.getElementById('favoriteButton');btn.classList.toggle('on',has);btn.textContent=has?'♥ Favorilere Eklendi':'♡ Favorilere Ekle';document.getElementById('heartTop').textContent=has?'♥':'♡'}
function toggleFavorite(){if(!selected)return;let key=selected.kind+':'+selected.index;favorites.includes(key)?favorites=favorites=favorites.filter(x=>x!==key):favorites.push(key);localStorage.setItem('cinarFavorites',JSON.stringify(favorites));syncFavorite();showToast(favorites.includes(key)?'Favorilere eklendi':'Favorilerden çıkarıldı')}
function openSearch(){show('search');document.getElementById('searchInput').focus();searchProducts('')}
function clearSearch(){let input=document.getElementById('searchInput');input.value='';searchProducts('');input.focus()}
function searchProducts(q){let term=q.trim().toLocaleLowerCase('tr');let all=[...pideItems.map((x,i)=>({...x,kind:'pides',index:i})),...drinks.map((x,i)=>({...x,kind:'drinks',index:i}))];let found=all.filter(x=>x.name.toLocaleLowerCase('tr').includes(term));document.getElementById('searchResults').innerHTML=found.map(x=>`<button class="resultcard" onclick="openDetail('${x.kind}',${x.index})"><img src="${x.img}" alt="${x.name}"><div class="resultname">${x.name}<span style="float:right">›</span></div></button>`).join('');document.getElementById('emptySearch').style.display=found.length?'none':'block'}
document.getElementById('searchInput').addEventListener('input',e=>searchProducts(e.target.value));function showToast(msg){document.getElementById('toastText').textContent=msg;document.getElementById('toast').classList.add('show')}function hideToast(){document.getElementById('toast').classList.remove('show')}render();setTimeout(()=>show('home'),5000);
</script></main></body></html>
